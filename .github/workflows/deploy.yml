name: Build & Deploy Production

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: roseluren26/tnp
  IMAGE_NAME: be-app
  DEPLOY_PATH: /opt/broenglish

jobs:
  build-app:
    name: Build App Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_NAME }}-${{ github.sha }}
          cache-from: type=gha,scope=broenglish-app
          cache-to: type=gha,mode=max,scope=broenglish-app

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/checkout@v4

      # Server không clone repo: chỉ cần file compose (giữ nguyên .env đã có trên server).
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: docker-compose.deploy.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DEPLOY_PATH
          script: |
            set -e

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"

            docker compose -f docker-compose.deploy.yml pull app
            docker compose -f docker-compose.deploy.yml up -d --force-recreate app

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3200/api/health >/dev/null 2>&1; then
                echo "App healthy ($i/20)"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "App không healthy sau 100s — logs:"
                docker logs --tail 80 broenglish_app_prod || true
                exit 1
              fi
              sleep 5
            done

            docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
