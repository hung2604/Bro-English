# Bro-English Production Nginx Configuration
# Đặt tại /etc/nginx/sites-available/english.conf rồi symlink sang /etc/nginx/sites-enabled/

upstream broenglish_app {
    server 127.0.0.1:3200;
    keepalive 16;
}

# HTTP → HTTPS (giữ đường dẫn ACME để certbot renew)
server {
    listen 80;
    listen [::]:80;
    server_name english.share-money.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://english.share-money.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name english.share-money.vn;

    ssl_certificate /etc/letsencrypt/live/english.share-money.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.share-money.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_broenglish:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Ảnh bill gửi lên agent
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Agent đọc tin/ảnh bằng AI có thể mất tới ~60s
    proxy_read_timeout 120s;

    # Asset đã hash tên file → cache lâu dài
    location /_nuxt/ {
        proxy_pass http://broenglish_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://broenglish_app;
    }

    access_log /var/log/nginx/english.access.log;
    error_log /var/log/nginx/english.error.log;
}
