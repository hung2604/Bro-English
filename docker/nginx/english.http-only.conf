# Bro-English — Nginx HTTP-only (dùng lần đầu, trước khi có SSL)
# /etc/nginx/sites-available/english.conf → symlink sites-enabled
# Sau khi certbot cấp cert xong → thay bằng english.conf

server {
    listen 80;
    listen [::]:80;
    server_name english.share-money.vn;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
