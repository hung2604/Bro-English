# Bro-English Docker Hub Deployment
# Image: roseluren26/tnp:be-app (build bởi .github/workflows/deploy.yml)
# VPS htc (103.109.186.73), chạy chung với HTC và ShareMoney.
# Domain: english.share-money.vn — Nginx (host) proxy → 127.0.0.1:3200
# MongoDB: dùng Mongo shared cũ (MONGODB_URI trong .env), không chạy Mongo riêng.
#
# Usage on server (/opt/broenglish):
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# Biến môi trường đọc từ file .env cạnh file này (xem .env.deploy.example).
# Rollback: BE_APP_TAG=be-app-<git sha> docker compose -f docker-compose.deploy.yml up -d app

services:
  app:
    image: roseluren26/tnp:${BE_APP_TAG:-be-app}
    container_name: broenglish_app_prod
    restart: always
    ports:
      - "127.0.0.1:3200:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
