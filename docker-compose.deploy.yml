# Bro-English production
# VPS htc (103.109.186.73), chạy chung với HTC và ShareMoney.
# Domain: english.share-money.vn — Nginx (host) proxy → 127.0.0.1:3200
# MongoDB: dùng Mongo shared cũ (MONGODB_URI trong .env), không chạy Mongo riêng.
#
# Deploy trên server (/opt/broenglish là bản clone của repo):
#   git pull && docker compose -f docker-compose.deploy.yml up -d --build
#
# Biến môi trường đọc từ file .env cạnh file này (xem .env.deploy.example).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: broenglish-app:latest
    container_name: broenglish_app_prod
    restart: always
    ports:
      - "127.0.0.1:3200:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
